name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Linux qualification environment
        run: docker build -f tools/qualification/Dockerfile -t work-cli-qualification:rust-1.98.1-git-2.55.0 .
      - name: Fetch locked dependencies
        run: tools/qualification/container.sh fetch --locked
      - name: Format
        run: tools/qualification/container.sh fmt --all -- --check
      - name: Complete workspace suite
        run: tools/qualification/container.sh test --workspace --locked -- --test-threads=4
      - name: Strict all-target Clippy
        run: tools/qualification/container.sh clippy --workspace --all-targets --locked -- -D warnings
      - name: Qualification helper tests
        run: tools/qualification/container.sh -- python3 -m unittest discover -s tests/qualification
      - name: Package supported Linux artifact
        run: tools/qualification/container.sh -- tools/package-linux.sh
      - name: Artifact workflow smoke
        run: tools/qualification/container.sh -- python3 tools/qualification/smoke.py target/dist/work-cli-0.1.0-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: work-cli-linux-x86_64
          path: target/dist/*
