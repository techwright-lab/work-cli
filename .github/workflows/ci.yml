name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Independent qualification: full-suite failures remain visible in `ci` below.
  task9-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Inspection unit tests
        run: cargo test -p work-cli --locked --lib inspection::tests::
      - name: Disposal unit tests
        run: cargo test -p work-cli --locked --lib disposal::tests::
      - name: Inspection and disposal integration tests
        run: cargo test -p work-cli --locked --test inspection --test disposal
      - name: Library and inspection Clippy
        run: cargo clippy -p work-cli --locked --lib --test inspection --test disposal -- -D warnings
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
