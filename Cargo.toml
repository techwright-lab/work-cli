[workspace]
resolver = "2"
members = ["crates/work-contract", "crates/work"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98.1"
repository = "https://github.com/techwright-lab/work-cli"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
schemars = { version = "1.2", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
uuid = { version = "1", features = ["serde", "v7"] }
work-contract = { path = "crates/work-contract" }

[workspace.lints.rust]
unsafe_code = "forbid"
