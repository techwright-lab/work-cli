[package]
name = "work-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Managed worktree lifecycle CLI"

[lints]
workspace = true

[dependencies]
clap.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
work-contract.workspace = true
uuid.workspace = true
rusqlite = { version = "0.38", features = ["bundled", "hooks", "limits"] }
sha2 = "0.10"
signal-hook = "0.3"
rustix = { version = "1", features = ["process", "fs"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "work_cli"
path = "src/lib.rs"

[[bin]]
name = "work"
path = "src/main.rs"
